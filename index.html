<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Three.js Animated Gradient</title>
  <style>
    body { margin: 0; overflow: hidden; background: #ffffff; }
    canvas { display: block; }
  </style>
  <!-- Load modules via importmap -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // === Scene Setup ===
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      75, window.innerWidth / window.innerHeight, 0.1, 1000
    );
    camera.position.set(6.2, -3.3, 1.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x000000, 0); // Transparent background
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enabled = false; // Disable mouse interaction

    // === Ribbon Group Setup ===
    const group = new THREE.Group();
    group.position.set(5.7, 1.9, -5.0);
    group.rotation.set(-0.09, -0.26, -0.85);
    group.scale.set(1.59, 1.45, 2.80);
    scene.add(group);

    const clock = new THREE.Clock();
    let entranceProgress = 0; // for fade-in effect

    // === Load Texture ===
    const loader = new THREE.TextureLoader();
    const texture = loader.load('/Textures/salmon.png', (tex) => {
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      tex.minFilter = THREE.LinearMipMapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
    });

    // === Shader Material Setup ===
    const makeMaterial = () => new THREE.ShaderMaterial({
      vertexShader: `
        varying vec2 vUv;
        
        uniform float uTime;
        uniform float uOpacity;

        void main() {
          vUv = uv;
          vec3 pos = position;

          // Apply gentle wave along Y using time and UV X
          pos.y += 0.02 * sin(uv.x * 15.0 + uTime * 2.0);

          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
      `,
      fragmentShader: `
       precision highp float;
       varying vec2 vUv;
       uniform sampler2D uTexture;
       uniform float uTime;
       uniform float uOpacity;

       void main() {
           vec2 uv = vUv;

           // Wandering offset — texture drifts inside shape
           vec2 drift = vec2(
               0.015 * sin(uTime * 0.5),
               0.01 * cos(uTime * 0.4)
           );
           uv += drift;

           // Local distortion waves (flowing inside)
           float waveX = sin(uv.y * 40.0 + uTime * 2.0) * 0.01;
           float waveY = cos(uv.x * 35.0 + uTime * 2.5) * 0.01;
           uv.x += waveX;
           uv.y += waveY;

           // Sample texture
           vec4 tex = texture2D(uTexture, uv);

           // Slight desaturation and brightness
           float luminance = dot(tex.rgb, vec3(0.5, 1.0, 0.114));
           vec3 softColor = mix(tex.rgb, vec3(luminance), 0.15); // desaturate
           softColor = mix(softColor, vec3(1.0), 0.05); // brighten slightly

           // Add subtle shimmer
           float shimmer = 0.015 * sin((uv.x + uv.y) * 15.0 + uTime * 2.0);
           softColor += shimmer;

           // Optional soft blur hint (very subtle glow)
           softColor = mix(softColor, vec3(luminance), 0.03);

        //    // Stronger pink boost
        //    vec3 pinkBoost = softColor;
        //    pinkBoost.r *= 1.35;  // increase red
        //    pinkBoost.b *= 1.25;  // increase blue
        //    pinkBoost.g *= 0.85;  // decrease green

           gl_FragColor = vec4(clamp(softColor, 0.0, 1.0), tex.a * uOpacity);
       }


    `,
      uniforms: {
        uTime: { value: 0.0 },
        uTexture: { value: texture },
        uOpacity: { value: 0.0 } // Start transparent for fade-in
      },
      side: THREE.DoubleSide,
      transparent: false,
      alphaTest: 0.01,
      depthWrite: false,
      depthTest: true,
      blending: THREE.NormalBlending,
      polygonOffset: true,
      polygonOffsetFactor: -1,
      polygonOffsetUnits: -1
    });

    // === Generate Braided Ribbon Curve ===
    const createCurve = (radius, offset, phase) => {
      const points = [];
      const len = 500;
      for (let i = 0; i < len; i++) {
        const t = i / (len - 1);
        const taper = 0.4 + 0.6 * Math.pow(Math.sin(t * Math.PI), 2.5);
        const wave = Math.sin(t * Math.PI * 2) * 0.5 * taper;
        const angle = t * Math.PI * 4 + phase;
        const x = Math.sin(angle) * radius * taper + offset.x + t * 5.0;
        const y = -t * 10.0 + wave;
        const z = Math.cos(angle) * radius * taper + offset.z + t * 5.0;
        points.push(new THREE.Vector3(x, y, z));
      }
      return new THREE.CatmullRomCurve3(points);
    };

    // === Build Ribbon Geometry from Curve ===
    const createRibbon = (curve, width, segments, material) => {
      const geometry = new THREE.BufferGeometry();
      const positions = [], uvs = [], indices = [];

      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const point = curve.getPoint(t);
        const tangent = curve.getTangent(t);
        const normal = new THREE.Vector3().crossVectors(tangent, new THREE.Vector3(0, 1, 0)).normalize().multiplyScalar(width / 2);
        const left = point.clone().add(normal);
        const right = point.clone().sub(normal);

        // Push vertices and UVs for two sides
        positions.push(...left.toArray(), ...right.toArray());
        uvs.push(0, t, 1, t);
      }

      // Create triangle indices
      for (let i = 0; i < segments; i++) {
        const idx = i * 2;
        indices.push(idx, idx + 1, idx + 2);
        indices.push(idx + 1, idx + 3, idx + 2);
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      return new THREE.Mesh(geometry, material);
    };

    // === Add 3 Ribbon Strands with Phase Offsets ===
    const materials = [makeMaterial(), makeMaterial(), makeMaterial()];
    const offsets = [
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0.04, 0, -0.04),
      new THREE.Vector3(-0.04, 0, 0.04)
    ];
    const phases = [0, Math.PI * 2 / 3, Math.PI * 4 / 3];

    for (let i = 0; i < 3; i++) {
      const curve = createCurve(0.2, offsets[i], phases[i]);
      const mesh = createRibbon(curve, 0.7, 500, materials[i]);
      mesh.renderOrder = i;
      group.add(mesh);
    }

    // === Lighting ===
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const light = new THREE.DirectionalLight(0xffdddd, 0.5);
    light.position.set(0, 10, 10);
    scene.add(light);

    // === Animation Loop ===
    function animate() {
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Gradually fade in opacity
      if (entranceProgress < 1) {
        entranceProgress += delta * 0.5;
        const eased = Math.min(1, entranceProgress);
        materials.forEach(mat => mat.uniforms.uOpacity.value = eased);
      }

      // Update shader time
      materials.forEach(mat => mat.uniforms.uTime.value = time);

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    // === Handle Resize ===
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
